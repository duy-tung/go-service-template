# Normal ClusterIP Service: the Gateway's backend target.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-engine.fullname" . }}
  labels:
    {{- include "order-engine.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "order-engine.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: 50051
      protocol: TCP
      appProtocol: kubernetes.io/h2c
