{{- if .Values.migrations.hookEnabled }}
# Schema migrations run as a single pre-install/pre-upgrade Job — one
# runner per rollout, never one per Pod — so N replicas starting at once
# cannot race on DDL. The binary additionally serializes on a PostgreSQL
# advisory lock (internal/migrate).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "order-engine.fullname" . }}-migrate
  labels:
    {{- include "order-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        # Deliberately NOT the app selector labels: the Services must never
        # route traffic to migration Pods.
        app.kubernetes.io/name: {{ include "order-engine.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "order-engine.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric IDs are required for the kubelet's runAsNonRoot
        # verification; they match the distroless nonroot user.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "order-engine.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: ORDER_ENGINE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
{{- end }}
