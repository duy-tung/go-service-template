{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "order-engine.fullname" . }}
  labels:
    {{- include "order-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "order-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway data plane and (optionally) in-cluster gRPC clients.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 50051
          protocol: TCP
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL.
    - to:
        {{- toYaml .Values.networkPolicy.egress.postgres.to | nindent 8 }}
      ports:
        - port: {{ .Values.networkPolicy.egress.postgres.port }}
          protocol: TCP
    {{- if .Values.otel.tracingEnabled }}
    # OTLP trace export.
    - to:
        {{- toYaml .Values.networkPolicy.egress.otel.to | nindent 8 }}
      ports:
        - port: {{ .Values.networkPolicy.egress.otel.port }}
          protocol: TCP
    {{- end }}
{{- end }}
